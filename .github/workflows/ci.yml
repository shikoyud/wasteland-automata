name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, typecheck, lint, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # only to commit pnpm-lock.yaml back when a branch has none yet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install (creates pnpm-lock.yaml if the branch has none yet)
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Commit the new lockfile back to the branch
        if: github.ref != 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "WA-101: add pnpm-lock.yaml generated by CI"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Agent guide (fails over 4,000 tokens)
        run: pnpm guide
      - uses: actions/upload-artifact@v4
        with:
          name: agent-guide
          path: packages/rules/dist/guide.md
      - name: Contract tests (forge, 1,000 fuzz runs)
        run: pnpm --filter @wa/contracts test

  acceptance:
    name: Acceptance (fresh clone, pnpm dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install (creates pnpm-lock.yaml if the branch has none yet)
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - run: pnpm test:acceptance
