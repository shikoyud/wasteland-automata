[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
# Paris until the testnet deploy (WA-802) confirms Robinhood Chain supports Cancun opcodes (plan 3.5).
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=node_modules/forge-std/src/"]

[fuzz]
runs = 1000
